<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>VeloCity | E-Bike Rentals for Couriers</title>

    <meta
      name="description"
      content="Reserve a courier e-bike by the day in Warsaw, Wroclaw, Gdansk or Poznan. Live availability, transparent tiered pricing, and a booking that is never double-sold."
    />

    <!--
      Open Graph and Twitter tags: without these a shared link renders as a bare
      URL with no title, summary or image in Slack, LinkedIn and iMessage.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VeloCity" />
    <meta property="og:title" content="VeloCity | E-Bike Rentals for Couriers" />
    <meta
      property="og:description"
      content="Reserve a courier e-bike by the day. Live availability, tiered pricing, and a booking that is never double-sold."
    />
    <!--
      Slack and Facebook resolve a root-relative image, but LinkedIn and
      several others require an absolute URL. Once the production domain is
      fixed, make this (and og:url) absolute:
        <meta property="og:image" content="https://<domain>/og-image.png" />
    -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="VeloCity landing page: Own the night, own your shift."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VeloCity | E-Bike Rentals for Couriers" />
    <meta
      name="twitter:description"
      content="Reserve a courier e-bike by the day. Live availability, tiered pricing, and a booking that is never double-sold."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
