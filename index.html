<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>VeloCity | E-Bike Rentals for Couriers</title>

    <meta
      name="description"
      content="Reserve a courier e-bike by the day in Warsaw, Wroclaw, Gdansk or Poznan. Live availability, transparent tiered pricing, and a booking that is never double-sold."
    />

    <!--
      Open Graph and Twitter tags: without these a shared link renders as a bare
      URL with no title, summary or image in Slack, LinkedIn and iMessage.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VeloCity" />
    <meta property="og:url" content="https://www.velocityfleet.dev/" />
    <meta property="og:title" content="VeloCity | E-Bike Rentals for Couriers" />
    <meta
      property="og:description"
      content="Reserve a courier e-bike by the day. Live availability, tiered pricing, and a booking that is never double-sold."
    />
    <!--
      Absolute, because LinkedIn and several other crawlers ignore a
      root-relative image. The domain is the production one; the bare
      velocityfleet.dev redirects to www.
    -->
    <meta property="og:image" content="https://www.velocityfleet.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="VeloCity landing page: Own the ride, own your shift."
    />
    <meta name="twitter:image" content="https://www.velocityfleet.dev/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="VeloCity landing page: Own the ride, own your shift."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VeloCity | E-Bike Rentals for Couriers" />
    <meta
      name="twitter:description"
      content="Reserve a courier e-bike by the day. Live availability, tiered pricing, and a booking that is never double-sold."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
